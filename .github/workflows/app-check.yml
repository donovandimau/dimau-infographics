name: Weekly app check
# Opens every live Dimau app at phone size every Monday morning (UK) and checks link previews,
# install-to-phone, the Share button and sideways scrolling. Problems go in one open issue
# ("Weekly app check"); the run fails so GitHub emails the owner. Fixed problems close the issue.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright==1.49.1 requests
          python -m playwright install --with-deps chromium
      - name: Check every app
        id: check
        continue-on-error: true
        run: python tools/app-check/check.py
      - name: Record the result in one issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly app check"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ "${{ steps.check.outcome }}" = "failure" ]; then
            if [ -n "$num" ]; then gh issue comment "$num" --body-file tools/app-check/report.md
            else gh issue create --title "$title" --body-file tools/app-check/report.md; fi
            exit 1
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "All apps passed on $(date -u +%d\ %b\ %Y)."
          fi
